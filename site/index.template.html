<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;600;700&family=Zen+Kaku+Gothic+New:wght@400;500;700;900&display=swap">
<title>静岡調理師試験対策</title>
<style>
  :root {
    --bg: #eef0e9;
    --bg-elevated: #f8f9f4;
    --bg-sunken: #e1e4d9;
    --text: #20241f;
    --text-muted: #666f60;
    --border: #d2d6c7;
    --accent: #2d4a63;
    --accent-text: #f4f7f2;
    --accent-soft: #dbe4e6;
    --good: #2f7a4f;
    --good-soft: #e1efe2;
    --bad: #ad3327;
    --bad-soft: #f6e2dd;
    --warn: #9c6a1c;
    --warn-soft: #f2e5cc;
    --stamp: #bf3b2c;
    --shadow: 0 1px 3px rgba(25,28,20,.08), 0 1px 2px rgba(25,28,20,.06);
    --radius: 14px;
    --nav-h: 60px;
    --safe-b: env(safe-area-inset-bottom, 0px);
    --safe-t: env(safe-area-inset-top, 0px);
    --font-display: "Shippori Mincho", "Hiragino Mincho ProN", serif;
    --font-body: "Zen Kaku Gothic New", -apple-system, BlinkMacSystemFont, "Hiragino Sans", sans-serif;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #14181a;
      --bg-elevated: #1d2427;
      --bg-sunken: #191f21;
      --text: #edf1ea;
      --text-muted: #97a197;
      --border: #333b3c;
      --accent: #7aa8c9;
      --accent-text: #0b1a22;
      --accent-soft: #223640;
      --good: #6fce93;
      --good-soft: #1c3324;
      --bad: #e28d80;
      --bad-soft: #3a231e;
      --warn: #dcb35e;
      --warn-soft: #392d16;
      --stamp: #e2664f;
      --shadow: 0 1px 3px rgba(0,0,0,.4), 0 1px 2px rgba(0,0,0,.3);
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #14181a;
    --bg-elevated: #1d2427;
    --bg-sunken: #191f21;
    --text: #edf1ea;
    --text-muted: #97a197;
    --border: #333b3c;
    --accent: #7aa8c9;
    --accent-text: #0b1a22;
    --accent-soft: #223640;
    --good: #6fce93;
    --good-soft: #1c3324;
    --bad: #e28d80;
    --bad-soft: #3a231e;
    --warn: #dcb35e;
    --warn-soft: #392d16;
    --stamp: #e2664f;
    --shadow: 0 1px 3px rgba(0,0,0,.4), 0 1px 2px rgba(0,0,0,.3);
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html, body { background: var(--bg); }
  body {
    color: var(--text);
    font-family: var(--font-body);
    line-height: 1.6;
    -webkit-tap-highlight-color: transparent;
    padding-bottom: calc(var(--nav-h) + var(--safe-b) + 30px);
    min-height: 100vh;
  }
  h1, h2, h3, h4 { line-height: 1.4; margin: 0 0 .5em; font-family: var(--font-display); text-wrap: balance; }
  p { margin: 0 0 .8em; }
  button { font-family: inherit; }
  .hidden { display: none !important; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  /* ---- layout shell ---- */
  #app { max-width: 640px; margin: 0 auto; padding: calc(14px + var(--safe-t)) 14px 14px; }
  @media (prefers-reduced-motion: no-preference) {
    #app.fade-in { animation: app-fade-in .28s ease-out; }
    @keyframes app-fade-in {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }
  }
  .topbar {
    position: sticky; top: 0; z-index: 5;
    background: var(--bg); padding: calc(10px + var(--safe-t)) 14px 10px;
    margin: calc(-1 * (14px + var(--safe-t))) -14px 12px;
    display: flex; align-items: center; justify-content: space-between;
    border-bottom: 1px solid transparent;
  }
  .topbar.scrolled { border-bottom-color: var(--border); }
  .topbar h1 { font-size: 19px; font-weight: 600; letter-spacing: .01em; }
  .icon-btn {
    width: 40px; height: 40px; border-radius: 999px; border: 1px solid var(--border);
    background: var(--bg-elevated); box-shadow: var(--shadow);
    display: flex; align-items: center; justify-content: center;
    font-size: 18px; color: var(--text);
  }

  nav#tabbar {
    position: fixed; left: 50%; bottom: calc(14px + var(--safe-b)); z-index: 10;
    transform: translateX(-50%);
    width: calc(100% - 28px); max-width: 560px;
    height: var(--nav-h);
    background: var(--bg-elevated);
    border: 1px solid var(--border);
    border-radius: 22px;
    box-shadow: 0 10px 28px rgba(20,18,12,.16), 0 2px 8px rgba(20,18,12,.08);
    display: flex;
  }
  nav#tabbar button {
    flex: 1; border: none; background: none; color: var(--text-muted);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 1px; font-size: 10.5px; padding: 6px 2px;
  }
  nav#tabbar button .ic {
    width: 40px; height: 26px; padding: 3px 0;
    display: inline-flex; align-items: center; justify-content: center;
    border-radius: 10px;
  }
  nav#tabbar button .ic svg { width: 22px; height: 22px; display: block; }
  nav#tabbar button.active { color: var(--accent); }
  nav#tabbar button.active .ic { background: var(--accent-soft); }
  .icon-btn svg { width: 19px; height: 19px; }
  .mk-flagchip svg { width: 15px; height: 15px; vertical-align: -2px; }
  .mk-list-btn svg { width: 15px; height: 15px; vertical-align: -2px; }

  /* ---- cards / primitives ---- */
  .card {
    background: var(--bg-elevated); border-radius: var(--radius);
    border: 1px solid var(--border);
    box-shadow: var(--shadow); padding: 16px; margin-bottom: 12px;
  }
  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    min-height: 48px; padding: 10px 18px; border-radius: 12px; border: none;
    font-size: 15px; font-weight: 600; cursor: pointer; width: 100%;
    background: var(--bg-sunken); color: var(--text);
  }
  .btn-primary { background: var(--accent); color: var(--accent-text); }
  .btn-ghost { background: transparent; border: 1px solid var(--border); }
  .btn-row { display: flex; gap: 8px; }
  .btn-row .btn { width: auto; flex: 1; }
  a.btn { text-decoration: none; box-sizing: border-box; }
  .kaisetsu-link { margin-bottom: 8px; }
  .btn-row a.btn { padding: 10px 6px; font-size: 14px; white-space: nowrap; }
  .pill {
    display: inline-block; padding: 3px 10px; border-radius: 999px;
    font-size: 12px; font-weight: 600; background: var(--bg-sunken); color: var(--text-muted);
  }
  .pill-accent { background: var(--accent-soft); color: var(--accent); }
  .pill-good { background: var(--good-soft); color: var(--good); }
  .pill-bad { background: var(--bad-soft); color: var(--bad); }
  .pill-warn { background: var(--warn-soft); color: var(--warn); }
  .muted { color: var(--text-muted); font-size: 13px; }
  .section-title {
    font-size: 13px; font-weight: 700; color: var(--text); letter-spacing: .02em;
    margin: 26px 0 10px; display: flex; align-items: center; gap: 8px;
  }
  .section-title::before { content: ""; width: 14px; height: 3px; background: var(--stamp); border-radius: 2px; flex-shrink: 0; }
  .section-title:first-child { margin-top: 0; }

  .bar-row { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
  .bar-label { width: 84px; flex-shrink: 0; font-size: 13px; }
  .bar-track { flex: 1; height: 10px; border-radius: 999px; background: var(--bg-sunken); position: relative; overflow: hidden; }
  .bar-fill { height: 100%; border-radius: 999px; background: var(--accent); }
  .bar-fill.good { background: var(--good); }
  .bar-fill.bad { background: var(--bad); }
  .bar-baseline { position: absolute; top: -2px; bottom: -2px; width: 2px; background: var(--text-muted); opacity: .5; }
  .bar-pct { width: 40px; flex-shrink: 0; text-align: right; font-size: 13px; font-variant-numeric: tabular-nums; }

  .hero {
    position: relative; overflow: hidden;
    background: var(--bg-elevated); border: 1px solid var(--border);
    border-radius: 24px; padding: 26px 22px 22px;
    margin-bottom: 12px; min-height: 140px;
    box-shadow: var(--shadow);
  }
  .hero-art {
    position: absolute; right: -28px; top: -28px; width: 130px; height: 130px;
    border-radius: 50%;
    background: var(--accent-soft);
  }
  .hero-img {
    position: absolute; right: -18px; bottom: -10px; width: min(52%, 300px); height: auto;
    filter: drop-shadow(0 8px 12px rgba(20,18,12,.16));
  }
  .hero-figure { position: relative; z-index: 1; max-width: 64%; }
  .hero-num { font-family: var(--font-display); font-size: 54px; font-weight: 700; line-height: 1; color: var(--accent); text-wrap: balance; }
  .hero-pct { font-size: 28px; font-weight: 500; opacity: .75; }
  .hero-label { font-size: 13px; color: var(--text-muted); margin-top: 9px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .hero-baseline { font-size: 11px; padding: 3px 9px; border: 1px solid var(--border); border-radius: 999px; color: var(--text); background: var(--bg-elevated); }

  .stat-row { display: flex; gap: 8px; margin-bottom: 12px; }
  .stat-chip { flex: 1; background: var(--bg-elevated); border: 1px solid var(--border); border-radius: 14px; padding: 11px 8px; text-align: center; }
  .stat-chip b { display: block; font-size: 19px; font-weight: 800; font-variant-numeric: tabular-nums; }
  .stat-chip span { font-size: 10.5px; color: var(--text-muted); }

  /* ---- question view ---- */
  .q-progress { font-size: 13px; color: var(--text-muted); margin-bottom: 6px; display: flex; justify-content: space-between; }
  .q-stem { font-family: var(--font-display); font-size: 18px; font-weight: 600; line-height: 1.65; margin-bottom: 10px; }
  .q-passage { background: var(--bg-sunken); border-radius: 10px; padding: 12px 14px; font-size: 14.5px; margin-bottom: 12px; }
  .q-header-row { display: flex; gap: 6px; font-size: 12px; color: var(--text-muted); margin-bottom: 6px; padding: 0 2px; }
  .q-header-row span { flex: 1; text-align: center; }
  .blank { color: var(--accent); font-weight: 700; }

  .choice {
    display: flex; align-items: flex-start; gap: 10px; width: 100%;
    text-align: left; background: var(--bg-elevated); border: 1.5px solid var(--border);
    border-radius: 12px; padding: 13px 14px; margin-bottom: 9px; font-size: 15px;
    box-shadow: var(--shadow); min-height: 48px; color: var(--text);
  }
  .choice .num {
    flex-shrink: 0; width: 24px; height: 24px; border-radius: 999px; background: var(--bg-sunken);
    display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 700;
    margin-top: 1px;
  }
  .choice.picked { border-color: var(--accent); }
  .choice.correct { border-color: var(--good); background: var(--good-soft); }
  .choice.correct .num { background: var(--good); color: #fff; }
  .choice.wrong { border-color: var(--bad); background: var(--bad-soft); }
  .choice.wrong .num { background: var(--bad); color: #fff; }
  .choice:disabled, .choice[data-locked="1"] { opacity: 1; }

  .choice-note { font-size: 13.5px; margin-top: -4px; margin-bottom: 9px; padding: 0 4px; color: var(--text-muted); }
  .choice-note.correct-note { color: var(--good); }
  .choice-note.wrong-note { color: var(--bad); }

  .explain-box { background: var(--accent-soft); border-radius: 12px; padding: 13px 14px; margin: 10px 0; font-size: 14.5px; }
  .explain-box .lbl { font-weight: 700; color: var(--accent); font-size: 12.5px; text-transform: uppercase; letter-spacing: .03em; margin-bottom: 4px; }
  .theme-link { display: inline-block; margin-top: 8px; font-size: 13px; color: var(--accent); font-weight: 600; }

  /* ---- filter chips ---- */
  .chip-grid { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip {
    padding: 9px 14px; border-radius: 999px; border: 1.5px solid var(--border);
    background: var(--bg-elevated); font-size: 13.5px; color: var(--text); min-height: 40px;
  }
  .chip.selected { border-color: var(--accent); background: var(--accent-soft); color: var(--accent); font-weight: 700; }

  /* ---- toranomaki ---- */
  .tk-toc-item {
    display: flex; align-items: center; justify-content: space-between;
    padding: 14px 4px; border-bottom: 1px solid var(--border); font-size: 15px; font-weight: 600;
  }
  .tk-toc-item .muted { font-weight: 400; }
  .tk-toc-left { display: flex; align-items: center; gap: 12px; min-width: 0; }
  .tk-toc-icon { width: 36px; height: 36px; border-radius: 10px; object-fit: cover; flex-shrink: 0; }
  details.tk-topic { border-bottom: 1px solid var(--border); padding: 12px 2px; }
  details.tk-topic summary { font-weight: 700; font-size: 15px; list-style: none; display: flex; justify-content: space-between; cursor: pointer; }
  details.tk-topic summary::-webkit-details-marker { display: none; }
  details.tk-topic summary::after { content: "＋"; color: var(--text-muted); font-weight: 400; }
  details.tk-topic[open] summary::after { content: "－"; }
  .tk-body { padding-top: 10px; font-size: 14.5px; }
  .tk-body table { width: 100%; border-collapse: collapse; margin: 10px 0; font-size: 13.5px; }
  .tk-body th, .tk-body td { border: 1px solid var(--border); padding: 6px 8px; text-align: left; }
  .tk-body th { background: var(--bg-sunken); }
  .tk-body ul, .tk-body ol { padding-left: 1.3em; margin: 0 0 .8em; }
  .tk-body li { margin-bottom: .3em; }
  .tk-body .hint { background: var(--warn-soft); color: var(--warn); border-radius: 10px; padding: 10px 12px; margin: 8px 0; font-size: 13.5px; }
  .tk-body strong { color: var(--accent); }
  .tk-search { width: 100%; min-height: 44px; border-radius: 12px; border: 1px solid var(--border); background: var(--bg-elevated); color: var(--text); padding: 0 14px; font-size: 15px; margin-bottom: 12px; }

  /* ---- mock exam ---- */
  .timer { font-variant-numeric: tabular-nums; font-weight: 800; font-size: 20px; }
  .timer.low { color: var(--bad); }
  .grid-nav { display: grid; grid-template-columns: repeat(6, 1fr); gap: 6px; margin: 10px 0; }
  .grid-nav button {
    aspect-ratio: 1; border-radius: 8px; border: 1.5px solid var(--border); background: var(--bg-elevated);
    font-size: 12px; font-weight: 700; color: var(--text-muted);
  }
  .grid-nav button.answered { border-color: var(--accent); color: var(--accent); background: var(--accent-soft); }
  .grid-nav button.current { outline: 2px solid var(--accent); outline-offset: 1px; }
  .grid-nav button.flagged::after { content: "●"; color: var(--warn); font-size: 8px; display: block; }

  .mk-list-btn {
    display: flex; align-items: center; gap: 6px; height: 40px; padding: 0 14px; border-radius: 999px;
    border: none; background: var(--bg-elevated); box-shadow: var(--shadow); font-size: 13px; font-weight: 700; color: var(--text);
  }
  .mk-flagchip {
    display: inline-flex; align-items: center; gap: 4px; border: 1px solid var(--border); background: var(--bg-elevated);
    border-radius: 999px; padding: 6px 12px; font-size: 13px; min-height: 36px;
  }
  .mk-flagchip.on { border-color: var(--warn); background: var(--warn-soft); color: var(--warn); font-weight: 700; }
  .mk-overlay {
    position: fixed; inset: 0; z-index: 20; background: rgba(0,0,0,.4);
    display: flex; align-items: flex-end;
  }
  .mk-sheet {
    background: var(--bg); width: 100%; max-height: 82vh; overflow-y: auto;
    border-radius: 18px 18px 0 0; padding: 16px 14px calc(16px + var(--safe-b));
  }
  .mk-sheet-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
  .mk-legend { display: flex; gap: 14px; font-size: 12px; color: var(--text-muted); margin-bottom: 10px; }
  .mk-legend span { display: inline-flex; align-items: center; gap: 4px; }
  .mk-legend i { width: 10px; height: 10px; border-radius: 3px; display: inline-block; border: 1.5px solid var(--border); }
  .mk-legend i.a { border-color: var(--accent); background: var(--accent-soft); }
  .mk-legend i.f { border-color: var(--warn); background: var(--warn-soft); }

  .empty-state { text-align: center; padding: 40px 20px; color: var(--text-muted); }
  .empty-state .big { margin-bottom: 14px; display: flex; justify-content: center; }

  /* ---- hanko stamp (achievement moments) ---- */
  .hanko {
    display: inline-flex; align-items: center; justify-content: center;
    width: 88px; height: 88px; border-radius: 50%;
    border: 3px solid var(--stamp); color: var(--stamp);
    font-family: var(--font-display); font-weight: 700; font-size: 26px;
    letter-spacing: .04em;
    transform: rotate(-9deg);
    position: relative;
    opacity: .92;
  }
  .hanko::before {
    content: ""; position: absolute; inset: 6px;
    border: 1px solid currentColor; border-radius: 50%; opacity: .55;
  }
  .hanko.lg { width: 132px; height: 132px; font-size: 36px; border-width: 4px; }
  .hanko.lg::before { inset: 9px; }

  a { color: var(--accent); }
</style>

<div id="app"></div>
<nav id="tabbar">
  <button data-tab="home"><span class="ic" data-icon="home"></span>ホーム</button>
  <button data-tab="practice"><span class="ic" data-icon="pencil"></span>演習</button>
  <button data-tab="mock"><span class="ic" data-icon="clock"></span>模試</button>
  <button data-tab="toranomaki"><span class="ic" data-icon="book"></span>虎の巻</button>
  <button data-tab="review"><span class="ic" data-icon="repeat"></span>復習</button>
</nav>

<script id="quiz-data" type="application/json">__QUESTIONS_JSON__</script>
<script id="toranomaki-data" type="application/json">__TORANOMAKI_JSON__</script>
<script id="images-data" type="application/json">__IMAGES_JSON__</script>

<script>
/* ============================================================
   静岡県調理師試験対策アプリ
   ============================================================ */
(function () {
  "use strict";

  const QUESTIONS = JSON.parse(document.getElementById('quiz-data').textContent);
  const TORANOMAKI = JSON.parse(document.getElementById('toranomaki-data').textContent);
  const IMAGES = JSON.parse(document.getElementById('images-data').textContent);
  const SUBJECTS = ["食文化概論", "公衆衛生学", "栄養学", "食品学", "食品衛生学", "調理理論"];
  const YEARS = ["R5", "R6", "R7"];
  const YEAR_LABEL = { R5: "令和5年度", R6: "令和6年度", R7: "令和7年度" };
  const QBY_ID = {};
  QUESTIONS.forEach(q => { QBY_ID[q.id] = q; });

  const MOCK_DURATION_SEC = 120 * 60;

  /* ---------------- icons (custom line-art, no emoji) ---------------- */
  const ICONS = {
    home: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 11.5 12 4l8 7.5"/><path d="M6 10v9h12v-9"/><path d="M10 19v-5h4v5"/></svg>',
    pencil: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20l1-4.5L15.5 5 19 8.5 8.5 19 4 20z"/><path d="M13 7l4 4"/></svg>',
    clock: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l3 2"/><path d="M9 2h6"/></svg>',
    book: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 6.2c-1.5-1.3-4-2.2-7-2.2v14.2c3 0 5.5.9 7 2.2 1.5-1.3 4-2.2 7-2.2V4c-3 0-5.5.9-7 2.2z"/><path d="M12 6.2v14.2"/></svg>',
    repeat: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12a8 8 0 0 1 14-5.3L20 8"/><path d="M20 4v4h-4"/><path d="M20 12a8 8 0 0 1-14 5.3L4 16"/><path d="M4 20v-4h4"/></svg>',
    moon: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M20 14.6A8.6 8.6 0 1 1 9.4 4a7 7 0 0 0 10.6 10.6z"/></svg>',
    sun: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="4.3" fill="currentColor" stroke="none"/><path d="M12 2.5v3M12 18.5v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M2.5 12h3M18.5 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1"/></svg>',
    backup: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v11"/><path d="M8 10l4 4 4-4"/><path d="M4 15v4a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-4"/></svg>',
    flag: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3v18"/><path d="M6 4h11l-3 4 3 4H6"/></svg>',
    list: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6h10M9 12h10M9 18h10"/><path d="M5 6h.01M5 12h.01M5 18h.01"/></svg>',
    check: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12.5l5 5L20 6"/></svg>',
  };

  /* ---------------- storage ---------------- */
  const STORE_KEY = "chorishi-v1";
  function loadState() {
    try {
      const raw = localStorage.getItem(STORE_KEY);
      if (raw) return JSON.parse(raw);
    } catch (e) { /* private mode etc. */ }
    return { answers: {}, mocks: [], streak: { last: null, count: 0 }, theme: "system", activeMock: null };
  }
  function saveState() {
    try { localStorage.setItem(STORE_KEY, JSON.stringify(state)); } catch (e) { /* ignore */ }
  }
  let state = loadState();
  if (!state.answers) state.answers = {};
  if (!state.mocks) state.mocks = [];
  if (!state.streak) state.streak = { last: null, count: 0 };
  if (!state.theme) state.theme = "system";

  function todayStr() {
    const d = new Date();
    return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
  }
  function bumpStreak() {
    const today = todayStr();
    if (state.streak.last === today) return;
    const y = new Date(Date.now() - 86400000);
    const yStr = y.getFullYear() + "-" + String(y.getMonth() + 1).padStart(2, "0") + "-" + String(y.getDate()).padStart(2, "0");
    state.streak.count = (state.streak.last === yStr) ? state.streak.count + 1 : 1;
    state.streak.last = today;
  }

  function recordAnswer(qid, picked) {
    const q = QBY_ID[qid];
    const correct = q.invalidated ? true : (picked === q.answer);
    const prev = state.answers[qid] || { timesAnswered: 0, timesWrong: 0 };
    prev.timesAnswered += 1;
    if (!correct) prev.timesWrong += 1;
    prev.picked = picked;
    prev.correct = correct;
    prev.lastAt = Date.now();
    state.answers[qid] = prev;
    bumpStreak();
    saveState();
    return correct;
  }

  /* ---------------- theme ---------------- */
  function applyTheme() {
    if (state.theme === "system") document.documentElement.removeAttribute("data-theme");
    else document.documentElement.setAttribute("data-theme", state.theme);
  }
  applyTheme();

  /* ---------------- stats helpers ---------------- */
  function subjectStats() {
    const out = {};
    SUBJECTS.forEach(s => out[s] = { total: 0, answered: 0, correct: 0 });
    QUESTIONS.forEach(q => {
      out[q.subject].total += 1;
      const a = state.answers[q.id];
      if (a) {
        out[q.subject].answered += 1;
        if (a.correct) out[q.subject].correct += 1;
      }
    });
    return out;
  }
  function overallStats() {
    let total = 0, answered = 0, correct = 0;
    Object.values(subjectStats()).forEach(s => { total += s.total; answered += s.answered; correct += s.correct; });
    return { total, answered, correct };
  }
  function weakestSubject() {
    const st = subjectStats();
    let worst = null, worstRate = 2;
    SUBJECTS.forEach(s => {
      if (st[s].answered === 0) return;
      const rate = st[s].correct / st[s].answered;
      if (rate < worstRate) { worstRate = rate; worst = s; }
    });
    return worst;
  }
  function reviewQueue() {
    return QUESTIONS.filter(q => {
      const a = state.answers[q.id];
      return a && !a.correct;
    }).sort((a, b) => {
      const A = state.answers[a.id], B = state.answers[b.id];
      if (B.timesWrong !== A.timesWrong) return B.timesWrong - A.timesWrong;
      return A.lastAt - B.lastAt;
    });
  }

  /* ---------------- routing ---------------- */
  let route = { tab: "home" };
  const app = document.getElementById("app");

  function nav(tab, params) {
    route = Object.assign({ tab }, params || {});
    render();
    window.scrollTo(0, 0);
  }

  document.getElementById("tabbar").addEventListener("click", e => {
    const btn = e.target.closest("button[data-tab]");
    if (!btn) return;
    nav(btn.dataset.tab);
  });

  let lastRenderedTab = null;
  function render() {
    document.querySelectorAll("#tabbar button").forEach(b => {
      b.classList.toggle("active", b.dataset.tab === route.tab);
    });
    if (route.tab === "home") renderHome();
    else if (route.tab === "practice") renderPractice();
    else if (route.tab === "mock") renderMock();
    else if (route.tab === "toranomaki") renderToranomaki();
    else if (route.tab === "review") renderReview();
    if (route.tab !== lastRenderedTab) {
      app.classList.remove("fade-in");
      void app.offsetWidth;
      app.classList.add("fade-in");
      lastRenderedTab = route.tab;
    }
  }

  function esc(s) {
    return String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  }
  function pct(n, d) { return d === 0 ? 0 : Math.round((n / d) * 100); }

  /* ============================================================
     HOME
     ============================================================ */
  function renderHome() {
    const st = subjectStats();
    const ov = overallStats();
    const weak = weakestSubject();
    const rq = reviewQueue();

    let html = `<div class="topbar"><h1>調理師試験対策</h1>
      <div style="display:flex;gap:8px;">
        <button class="icon-btn" id="backup-open">${ICONS.backup}</button>
        <button class="icon-btn" id="theme-toggle">${state.theme === "dark" ? ICONS.sun : ICONS.moon}</button>
      </div>
    </div>`;

    html += `<div class="hero">
      <div class="hero-art" aria-hidden="true"></div>
      ${IMAGES.hero ? `<img class="hero-img" src="${IMAGES.hero}" alt="">` : ""}
      <div class="hero-figure">
        <div class="hero-num">${pct(ov.correct, ov.answered)}<span class="hero-pct">%</span></div>
        <div class="hero-label">総合正答率 <span class="hero-baseline">合格目安 60%</span></div>
      </div>
    </div>`;

    html += `<div class="stat-row">
      <div class="stat-chip"><b>${ov.total - ov.answered}</b><span>未着手</span></div>
      <div class="stat-chip"><b>${state.streak.count}</b><span>連続学習日数</span></div>
      <div class="stat-chip"><b>${rq.length}</b><span>復習待ち</span></div>
    </div>`;

    html += `<div class="section-title">次にやるべきこと</div>`;
    html += `<div class="card">`;
    if (ov.answered === 0) {
      html += `<p>まずは演習タブから、どれか1科目を解いてみましょう。静岡県は「食品衛生学」と「調理理論」だけで出題の55%を占めます。</p>
        <button class="btn btn-primary" id="go-practice-start">演習をはじめる</button>`;
    } else if (rq.length >= 5) {
      html += `<p>間違えた問題が ${rq.length} 問たまっています。忘れる前に復習しましょう。</p>
        <button class="btn btn-primary" id="go-review">復習する</button>`;
    } else if (weak) {
      html += `<p>今のところ「<b>${esc(weak)}</b>」の正答率が最も低めです。集中して演習しましょう。</p>
        <button class="btn btn-primary" id="go-weak">「${esc(weak)}」を演習する</button>`;
    } else {
      html += `<p>順調です。このまま全科目まんべんなく演習を続けましょう。1科目でも極端に弱いと不合格になる試験形式です。</p>
        <button class="btn btn-primary" id="go-practice-start">演習をはじめる</button>`;
    }
    html += `</div>`;

    html += `<div class="section-title">過去問 解説付き解答</div><div class="card">
      <p class="muted" style="margin:0 0 10px;">年度ごとに全60問。自分で解いてから、1問ずつ解答・解説を開いて答え合わせできます。</p>
      <div class="btn-row">${YEARS.map(y => `<a class="btn btn-ghost" href="kaisetsu/${y}.html">${YEAR_LABEL[y]}</a>`).join("")}</div>
    </div>`;

    html += `<div class="section-title">科目別 正答率</div><div class="card">`;
    SUBJECTS.forEach(s => {
      const d = st[s];
      const p = pct(d.correct, d.answered);
      const cls = d.answered === 0 ? "" : (p >= 60 ? "good" : "bad");
      html += `<div class="bar-row">
        <div class="bar-label">${esc(s)}</div>
        <div class="bar-track"><div class="bar-baseline" style="left:60%"></div><div class="bar-fill ${cls}" style="width:${p}%"></div></div>
        <div class="bar-pct">${d.answered ? p + "%" : "―"}</div>
      </div>`;
    });
    html += `<p class="muted" style="margin-top:6px;">縦線は合格目安ライン（60%）。1科目でも著しく低いと不合格になりやすいので、赤い科目を優先してください。</p>`;
    html += `</div>`;

    html += `<div class="section-title">模試の結果</div><div class="card">`;
    if (state.mocks.length === 0) {
      html += `<p class="muted">まだ模試を受けていません。演習に慣れたら60問通しの模試に挑戦しましょう。</p>`;
    } else {
      state.mocks.slice().reverse().slice(0, 3).forEach(m => {
        const passed = m.pass;
        html += `<div style="display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--border);">
          <div><div style="font-weight:600;">${esc(m.label)}</div><div class="muted">${new Date(m.finishedAt).toLocaleDateString("ja-JP")}</div></div>
          <div style="text-align:right;"><div style="font-weight:800;">${m.score}/60</div><span class="pill ${passed ? 'pill-good' : 'pill-bad'}">${passed ? "合格ライン到達" : "要注意"}</span></div>
        </div>`;
      });
    }
    html += `</div>`;

    if (backupOverlayOpen) html += renderBackupOverlay();

    app.innerHTML = html;

    const themeBtn = document.getElementById("theme-toggle");
    themeBtn.onclick = () => {
      state.theme = state.theme === "dark" ? "light" : "dark";
      applyTheme(); saveState(); renderHome();
    };
    const goPractice = document.getElementById("go-practice-start");
    if (goPractice) goPractice.onclick = () => nav("practice");
    const goReview = document.getElementById("go-review");
    if (goReview) goReview.onclick = () => nav("review");
    const goWeak = document.getElementById("go-weak");
    if (goWeak) goWeak.onclick = () => nav("practice", { autoStart: { mode: "subject", subject: weak } });
    document.getElementById("backup-open").onclick = () => { backupOverlayOpen = true; renderHome(); };
    wireBackupOverlay();
  }

  /* ---------------- backup (export/import) ---------------- */
  let backupOverlayOpen = false;

  function renderBackupOverlay() {
    let dump = "";
    try { dump = JSON.stringify(state); } catch (e) { dump = "{}"; }
    return `<div class="mk-overlay" id="bk-overlay"><div class="mk-sheet">
      <div class="mk-sheet-head"><h3 style="margin:0;">学習データのバックアップ</h3><button class="icon-btn" id="bk-close">×</button></div>
      <p class="muted">端末を変えるときは、下のテキストを全部コピーして保管してください。新しい端末では、それを貼り付けて「復元する」を押すと学習履歴が引き継がれます。この操作はブラウザの保存領域(localStorage)を直接読み書きするだけで、外部には送信されません。</p>
      <div class="section-title">エクスポート（コピーする）</div>
      <textarea id="bk-export" class="tk-search" style="height:110px;padding:10px 14px;" readonly>${esc(dump)}</textarea>
      <button class="btn" id="bk-copy" style="margin-top:8px;">クリップボードにコピー</button>
      <p class="muted" id="bk-copy-msg" style="min-height:1.4em;margin:6px 0 0;"></p>
      <div class="section-title">インポート（貼り付けて復元）</div>
      <p class="muted" style="margin-top:-4px;">「復元する」を押すと、現在の学習履歴は貼り付けた内容で上書きされます。</p>
      <textarea id="bk-import" class="tk-search" style="height:110px;padding:10px 14px;" placeholder="ここに以前コピーしたデータを貼り付け"></textarea>
      <button class="btn btn-primary" id="bk-restore" style="margin-top:8px;">復元する</button>
      <p class="muted" id="bk-restore-msg" style="min-height:1.4em;margin:6px 0 0;"></p>
    </div></div>`;
  }

  function wireBackupOverlay() {
    const overlay = document.getElementById("bk-overlay");
    if (!overlay) return;
    document.getElementById("bk-close").onclick = () => { backupOverlayOpen = false; renderHome(); };
    overlay.addEventListener("click", e => { if (e.target === overlay) { backupOverlayOpen = false; renderHome(); } });
    document.getElementById("bk-copy").onclick = async () => {
      const ta = document.getElementById("bk-export");
      const msg = document.getElementById("bk-copy-msg");
      ta.select();
      try {
        await navigator.clipboard.writeText(ta.value);
        msg.textContent = "コピーしました。";
      } catch (e) {
        msg.textContent = "自動コピーに失敗しました。テキストは選択済みなので、そのまま長押し→コピーしてください。";
      }
    };
    document.getElementById("bk-restore").onclick = () => {
      const raw = document.getElementById("bk-import").value.trim();
      const msg = document.getElementById("bk-restore-msg");
      if (!raw) return;
      let parsed;
      try { parsed = JSON.parse(raw); } catch (e) {
        msg.textContent = "データの形式が正しくありません。コピーした内容をそのまま貼り付けてください。";
        return;
      }
      state = Object.assign({ answers: {}, mocks: [], streak: { last: null, count: 0 }, theme: "system" }, parsed);
      applyTheme();
      saveState();
      backupOverlayOpen = false;
      renderHome();
    };
  }

  /* ============================================================
     PRACTICE (一問一答)
     ============================================================ */
  let practiceSession = null; // { queue: [ids], idx, answeredThis }

  function buildQueue(filter) {
    let list = QUESTIONS.slice();
    if (filter.mode === "subject") list = list.filter(q => q.subject === filter.subject);
    else if (filter.mode === "year") list = list.filter(q => q.year === filter.year);
    else if (filter.mode === "theme") list = list.filter(q => q.theme === filter.theme);
    else if (filter.mode === "weak") list = list.filter(q => { const a = state.answers[q.id]; return a && !a.correct; });
    else if (filter.mode === "unseen") list = list.filter(q => !state.answers[q.id]);
    else if (filter.mode === "ids") list = filter.ids.map(id => QBY_ID[id]);
    if (filter.mode !== "ids") {
      for (let i = list.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [list[i], list[j]] = [list[j], list[i]];
      }
    }
    return list.map(q => q.id);
  }

  function renderPractice() {
    if (route.autoStart && !practiceSession) {
      practiceSession = { queue: buildQueue(route.autoStart), idx: 0 };
      route.autoStart = null;
    }
    if (!practiceSession) return renderPracticeSetup();
    renderPracticeQuestion();
  }

  function renderPracticeSetup() {
    let html = `<div class="topbar"><h1>演習</h1></div>`;
    html += `<div class="section-title">科目別</div><div class="card"><div class="chip-grid">`;
    SUBJECTS.forEach(s => html += `<button class="chip" data-mode="subject" data-val="${esc(s)}">${esc(s)}</button>`);
    html += `</div></div>`;

    html += `<div class="section-title">年度別</div><div class="card"><div class="chip-grid">`;
    YEARS.forEach(y => html += `<button class="chip" data-mode="year" data-val="${y}">${YEAR_LABEL[y]}</button>`);
    html += `</div></div>`;

    html += `<div class="section-title">その他</div><div class="card">
      <div class="btn-row" style="margin-bottom:8px;">
        <button class="btn" data-mode="weak">苦手のみ</button>
        <button class="btn" data-mode="unseen">未着手のみ</button>
      </div>
      <button class="btn btn-primary" data-mode="all">全180問からランダム</button>
    </div>`;

    html += `<div class="section-title">テーマ別</div><div class="card" id="theme-chips">`;
    SUBJECTS.forEach(s => {
      const themes = Array.from(new Set(QUESTIONS.filter(q => q.subject === s).map(q => q.theme).filter(Boolean)));
      html += `<details class="tk-topic"><summary>${esc(s)} <span class="muted" style="font-weight:400;">(${themes.length})</span></summary>
        <div class="tk-body"><div class="chip-grid">`;
      themes.forEach(t => html += `<button class="chip" data-mode="theme" data-val="${esc(t)}">${esc(t)}</button>`);
      html += `</div></div></details>`;
    });
    html += `</div>`;

    html += `<p class="muted" id="pr-setup-msg" style="text-align:center;min-height:1.4em;"></p>`;

    app.innerHTML = html;
    app.querySelectorAll("[data-mode]").forEach(btn => {
      btn.onclick = () => {
        const mode = btn.dataset.mode;
        const filter = mode === "subject" ? { mode, subject: btn.dataset.val }
          : mode === "year" ? { mode, year: btn.dataset.val }
          : mode === "theme" ? { mode, theme: btn.dataset.val }
          : { mode };
        const queue = buildQueue(filter);
        if (queue.length === 0) {
          const msg = document.getElementById("pr-setup-msg");
          if (msg) msg.textContent = "該当する問題がありません。";
          return;
        }
        practiceSession = { queue, idx: 0 };
        render();
      };
    });
  }

  function renderPracticeQuestion() {
    const { queue, idx } = practiceSession;
    if (idx >= queue.length) {
      app.innerHTML = `<div class="topbar"><h1>演習</h1></div>
        <div class="empty-state"><div class="big"><span class="hanko">済</span></div><p>この範囲は解き終わりました。</p></div>
        <button class="btn btn-primary" id="pr-again">もう一度この範囲を解く</button>
        <div style="height:10px;"></div>
        <button class="btn" id="pr-exit">演習メニューに戻る</button>`;
      document.getElementById("pr-again").onclick = () => { practiceSession.idx = 0; render(); };
      document.getElementById("pr-exit").onclick = () => { practiceSession = null; render(); };
      return;
    }
    const q = QBY_ID[queue[idx]];
    const answered = state.answers[q.id] && practiceSession.justAnswered === q.id;

    let html = `<div class="topbar">
      <button class="icon-btn" id="pr-close">×</button>
      <div class="q-progress" style="flex:1;text-align:center;">${idx + 1} / ${queue.length}</div>
      <span style="width:40px;"></span>
    </div>`;

    html += `<div class="card">`;
    html += `<div style="margin-bottom:8px;"><span class="pill pill-accent">${esc(q.subject)}</span> <span class="pill">${YEAR_LABEL[q.year]} 問${q.no}</span></div>`;
    html += `<div class="q-stem">${esc(q.stem)}</div>`;
    if (q.passage) html += `<div class="q-passage">${renderBlanks(q.passage)}</div>`;
    if (q.optionHeader) html += `<div class="q-header-row">${q.optionHeader.map(h => `<span>${esc(h)}</span>`).join("")}</div>`;

    const locked = practiceSession.justAnswered === q.id;
    const picked = locked ? state.answers[q.id].picked : null;

    q.choices.forEach((c, i) => {
      const num = i + 1;
      let cls = "choice";
      let badge = num;
      if (locked) {
        if (num === q.answer) { cls += " correct"; badge = "◯"; }
        else if (num === picked) { cls += " wrong"; badge = "✕"; }
      }
      html += `<button class="${cls}" data-choice="${num}" ${locked ? 'disabled data-locked="1"' : ""}>
        <span class="num">${badge}</span><span>${esc(c)}</span>
      </button>`;
      if (locked) {
        const note = q.choiceNotes ? q.choiceNotes[i] : "";
        if (note) html += `<div class="choice-note ${num === q.answer ? "correct-note" : (num === picked ? "wrong-note" : "")}">${esc(note)}</div>`;
      }
    });

    if (locked) {
      if (q.invalidated) html += `<p class="muted">※この問題は静岡県の発表により「全員正解」として扱われています。</p>`;
      if (q.explanation) html += `<div class="explain-box"><div class="lbl">解説</div>${esc(q.explanation)}</div>`;
      html += `<a class="btn btn-ghost kaisetsu-link" href="kaisetsu/${q.year}.html#q${q.no}">詳しい解説ページで見る ›</a>`;
      html += `<button class="btn btn-primary" id="pr-next">次の問題へ</button>`;
    }
    html += `</div>`;

    app.innerHTML = html;
    document.getElementById("pr-close").onclick = () => { practiceSession = null; render(); };

    if (!locked) {
      app.querySelectorAll(".choice").forEach(btn => {
        btn.onclick = () => {
          const picked = parseInt(btn.dataset.choice, 10);
          recordAnswer(q.id, picked);
          practiceSession.justAnswered = q.id;
          render();
        };
      });
    } else {
      document.getElementById("pr-next").onclick = () => {
        practiceSession.idx += 1;
        practiceSession.justAnswered = null;
        render();
      };
    }
  }

  function renderBlanks(text) {
    return esc(text).replace(/【([^】]*)】/g, (m, g) => `<span class="blank">【${g || "　"}】</span>`);
  }

  /* ============================================================
     REVIEW
     ============================================================ */
  function renderReview() {
    const rq = reviewQueue();
    let html = `<div class="topbar"><h1>復習</h1></div>`;
    if (rq.length === 0) {
      html += `<div class="empty-state"><div class="big"><span class="hanko">◎</span></div><p>今のところ復習待ちの問題はありません。</p></div>`;
      app.innerHTML = html;
      return;
    }
    html += `<div class="card"><p class="muted" style="margin-bottom:10px;">間違えた回数が多い順・最後に解いてから時間が経っている順に並んでいます。</p>
      <button class="btn btn-primary" id="rv-start">この${rq.length}問を連続で解く</button></div>`;

    html += `<div class="section-title">一覧</div>`;
    rq.forEach(q => {
      const a = state.answers[q.id];
      html += `<div class="card" style="padding:12px 14px;">
        <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:8px;">
          <div>
            <div style="margin-bottom:4px;"><span class="pill pill-accent">${esc(q.subject)}</span> <span class="pill">${YEAR_LABEL[q.year]} 問${q.no}</span></div>
            <div style="font-size:14px;">${esc(q.stem)}</div>
          </div>
          <span class="pill pill-bad" style="flex-shrink:0;">${a.timesWrong}回誤答</span>
        </div>
      </div>`;
    });
    app.innerHTML = html;
    document.getElementById("rv-start").onclick = () => {
      practiceSession = { queue: rq.map(q => q.id), idx: 0 };
      nav("practice");
    };
  }

  /* ============================================================
     MOCK EXAM
     ============================================================ */
  function buildMockSet(kind) {
    if (kind === "R5" || kind === "R6" || kind === "R7") {
      return QUESTIONS.filter(q => q.year === kind).sort((a, b) => a.no - b.no).map(q => q.id);
    }
    // random, following the real subject distribution
    const bySubject = {};
    SUBJECTS.forEach(s => bySubject[s] = QUESTIONS.filter(q => q.subject === s));
    let out = [];
    SUBJECTS.forEach(s => {
      const pool = bySubject[s].slice();
      for (let i = pool.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [pool[i], pool[j]] = [pool[j], pool[i]]; }
      const need = { "食文化概論": 5, "公衆衛生学": 8, "栄養学": 8, "食品学": 6, "食品衛生学": 16, "調理理論": 17 }[s];
      out = out.concat(pool.slice(0, need).map(q => q.id));
    });
    return out;
  }

  function renderMock() {
    if (state.activeMock && !state.activeMock.finishedAt) return renderMockExam();
    renderMockSetup();
  }

  function renderMockSetup() {
    let html = `<div class="topbar"><h1>模試</h1></div>`;
    html += `<div class="card">
      <p>60問・120分のマークシート形式模試です。途中で閉じても再開できます。</p>
    </div>`;
    html += `<div class="section-title">本番セット（実際の1回分）</div><div class="card"><div class="btn-row" style="flex-wrap:wrap;">`;
    YEARS.forEach(y => html += `<button class="btn" data-year="${y}" style="flex:1 1 30%;">${YEAR_LABEL[y]}</button>`);
    html += `</div></div>`;
    html += `<div class="section-title">ランダム模試</div><div class="card"><button class="btn btn-primary" data-year="random">科目配分に従ったランダム60問</button></div>`;

    if (state.mocks.length > 0) {
      html += `<div class="section-title">過去の模試結果</div>`;
      state.mocks.slice().reverse().forEach(m => {
        html += `<div class="card" style="padding:12px 14px;display:flex;justify-content:space-between;align-items:center;">
          <div><div style="font-weight:600;">${esc(m.label)}</div><div class="muted">${new Date(m.finishedAt).toLocaleString("ja-JP")}</div></div>
          <div style="font-weight:800;">${m.score}/60</div>
        </div>`;
      });
    }
    app.innerHTML = html;
    app.querySelectorAll("[data-year]").forEach(btn => {
      btn.onclick = () => {
        const kind = btn.dataset.year;
        const ids = buildMockSet(kind);
        state.activeMock = {
          label: kind === "random" ? "ランダム模試" : YEAR_LABEL[kind] + " セット",
          ids, picks: {}, flags: {}, startedAt: Date.now(),
          endsAt: Date.now() + MOCK_DURATION_SEC * 1000,
          cur: 0
        };
        saveState();
        render();
      };
    });
  }

  let mockTimerHandle = null;

  let mockOverlayOpen = false;

  function renderMockExam() {
    const m = state.activeMock;
    const q = QBY_ID[m.ids[m.cur]];
    const answeredCount = m.ids.filter(id => m.picks[id] != null).length;

    let html = `<div class="topbar">
      <button class="icon-btn" id="mk-pause">‖</button>
      <div class="timer" id="mk-timer">--:--</div>
      <button class="mk-list-btn" id="mk-open-list">${m.cur + 1} / ${m.ids.length} ${ICONS.list}</button>
    </div>`;

    html += `<div class="bar-track" style="height:6px;margin-bottom:12px;"><div class="bar-fill" style="width:${pct(answeredCount, m.ids.length)}%"></div></div>`;

    html += `<div class="card">`;
    html += `<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;">
      <div><span class="pill pill-accent">${esc(q.subject)}</span> <span class="pill">問${m.cur + 1}</span></div>
      <button class="mk-flagchip ${m.flags[q.id] ? "on" : ""}" id="mk-flag">${ICONS.flag} 見直し</button>
    </div>`;
    html += `<div class="q-stem">${esc(q.stem)}</div>`;
    if (q.passage) html += `<div class="q-passage">${renderBlanks(q.passage)}</div>`;
    if (q.optionHeader) html += `<div class="q-header-row">${q.optionHeader.map(h => `<span>${esc(h)}</span>`).join("")}</div>`;
    q.choices.forEach((c, i) => {
      const num = i + 1;
      const cls = "choice" + (m.picks[q.id] === num ? " picked" : "");
      html += `<button class="${cls}" data-choice="${num}"><span class="num">${num}</span><span>${esc(c)}</span></button>`;
    });
    html += `</div>`;

    html += `<div class="btn-row">
      <button class="btn" id="mk-prev" ${m.cur === 0 ? "disabled" : ""}>前へ</button>
      ${m.cur === m.ids.length - 1
        ? `<button class="btn btn-primary" id="mk-submit">解答を終了する</button>`
        : `<button class="btn btn-primary" id="mk-next">次へ</button>`}
    </div>`;

    if (mockOverlayOpen) {
      html += `<div class="mk-overlay" id="mk-overlay"><div class="mk-sheet">
        <div class="mk-sheet-head"><h3 style="margin:0;">問題一覧（${answeredCount}/${m.ids.length}解答済み）</h3><button class="icon-btn" id="mk-close-list">×</button></div>
        <div class="mk-legend"><span><i class="a"></i>解答済み</span><span><i class="f"></i>見直しフラグ</span></div>
        <div class="grid-nav">`;
      m.ids.forEach((id, i) => {
        let cls = "";
        if (m.picks[id] != null) cls += " answered";
        if (i === m.cur) cls += " current";
        if (m.flags[id]) cls += " flagged";
        html += `<button class="${cls}" data-jump="${i}">${i + 1}</button>`;
      });
      html += `</div></div></div>`;
    }

    app.innerHTML = html;

    app.querySelectorAll("[data-jump]").forEach(btn => btn.onclick = () => {
      m.cur = parseInt(btn.dataset.jump, 10); mockOverlayOpen = false; saveState(); render();
    });
    app.querySelectorAll(".choice").forEach(btn => btn.onclick = () => {
      m.picks[q.id] = parseInt(btn.dataset.choice, 10);
      saveState();
      render();
    });
    document.getElementById("mk-flag").onclick = () => { m.flags[q.id] = !m.flags[q.id]; saveState(); render(); };
    document.getElementById("mk-open-list").onclick = () => { mockOverlayOpen = true; render(); };
    const closeBtn = document.getElementById("mk-close-list");
    if (closeBtn) closeBtn.onclick = () => { mockOverlayOpen = false; render(); };
    const overlay = document.getElementById("mk-overlay");
    if (overlay) overlay.addEventListener("click", e => { if (e.target === overlay) { mockOverlayOpen = false; render(); } });
    const prevBtn = document.getElementById("mk-prev");
    if (prevBtn) prevBtn.onclick = () => { m.cur -= 1; saveState(); render(); };
    const nextBtn = document.getElementById("mk-next");
    if (nextBtn) nextBtn.onclick = () => { m.cur += 1; saveState(); render(); };
    const submitBtn = document.getElementById("mk-submit");
    if (submitBtn) submitBtn.onclick = () => { mockOverlayOpen = false; finishMock(); };
    document.getElementById("mk-pause").onclick = () => {
      mockOverlayOpen = false;
      state.activeMock = null; saveState();
      nav("home");
    };

    startMockTimer();
  }

  function startMockTimer() {
    clearInterval(mockTimerHandle);
    function tick() {
      const m = state.activeMock;
      if (!m || m.finishedAt) { clearInterval(mockTimerHandle); return; }
      const remain = Math.max(0, Math.round((m.endsAt - Date.now()) / 1000));
      const el = document.getElementById("mk-timer");
      if (el) {
        const mm = String(Math.floor(remain / 60)).padStart(2, "0");
        const ss = String(remain % 60).padStart(2, "0");
        el.textContent = mm + ":" + ss;
        el.classList.toggle("low", remain < 300);
      }
      if (remain <= 0) finishMock();
    }
    tick();
    mockTimerHandle = setInterval(tick, 1000);
  }

  function finishMock() {
    const m = state.activeMock;
    m.finishedAt = Date.now();
    clearInterval(mockTimerHandle);

    const bySubject = {};
    SUBJECTS.forEach(s => bySubject[s] = { total: 0, correct: 0 });
    let score = 0;
    const wrongIds = [];
    m.ids.forEach(id => {
      const q = QBY_ID[id];
      const picked = m.picks[id];
      const correct = q.invalidated ? true : picked === q.answer;
      bySubject[q.subject].total += 1;
      if (correct) { bySubject[q.subject].correct += 1; score += 1; } else wrongIds.push(id);
      recordAnswer(id, picked == null ? -1 : picked);
    });

    const weakSubjects = SUBJECTS.filter(s => bySubject[s].total > 0 && (bySubject[s].correct / bySubject[s].total) < 0.6);
    const pass = score >= 36 && weakSubjects.length === 0;

    m.score = score;
    m.bySubject = bySubject;
    m.wrongIds = wrongIds;
    m.pass = pass;
    m.weakSubjects = weakSubjects;

    state.mocks.push(m);
    state.activeMock = null;
    saveState();
    route = { tab: "mock", resultMock: m };
    renderMockResult(m);
  }

  function renderMockResult(m) {
    let html = `<div class="topbar"><h1>模試結果</h1></div>`;
    html += `<div class="card" style="text-align:center;">
      <div style="display:flex;align-items:center;justify-content:center;gap:18px;">
        <div style="font-size:44px;font-weight:800;font-family:var(--font-display);">${m.score}<span style="font-size:20px;color:var(--text-muted);font-family:var(--font-body);">/60</span></div>
        ${m.pass ? `<span class="hanko">合格</span>` : ""}
      </div>
      ${m.pass ? "" : `<span class="pill pill-bad" style="margin-top:10px;">要注意</span>`}
      <p class="muted" style="margin-top:10px;">総合6割（36点）以上、かつ全科目6割以上が静岡県調理師試験の実質的な合格ラインの目安です（本番の平均点基準とは異なる簡易判定です）。</p>
    </div>`;

    html += `<div class="section-title">科目別スコア</div><div class="card">`;
    SUBJECTS.forEach(s => {
      const d = m.bySubject[s];
      const p = pct(d.correct, d.total);
      html += `<div class="bar-row">
        <div class="bar-label">${esc(s)}</div>
        <div class="bar-track"><div class="bar-baseline" style="left:60%"></div><div class="bar-fill ${p >= 60 ? "good" : "bad"}" style="width:${p}%"></div></div>
        <div class="bar-pct">${d.correct}/${d.total}</div>
      </div>`;
    });
    if (m.weakSubjects.length) html += `<p class="muted">「${m.weakSubjects.join("」「")}」が6割未満です。この科目を優先して復習しましょう。</p>`;
    html += `</div>`;

    if (m.wrongIds.length) {
      html += `<button class="btn btn-primary" id="mk-review-wrong">間違えた${m.wrongIds.length}問を解き直す</button><div style="height:10px;"></div>`;
    }
    html += `<button class="btn" id="mk-back">模試メニューに戻る</button>`;
    app.innerHTML = html;

    const wrongBtn = document.getElementById("mk-review-wrong");
    if (wrongBtn) wrongBtn.onclick = () => {
      practiceSession = { queue: m.wrongIds.slice(), idx: 0 };
      nav("practice");
    };
    document.getElementById("mk-back").onclick = () => { route = { tab: "mock" }; render(); };
  }

  /* ============================================================
     TORANOMAKI
     ============================================================ */
  function renderToranomaki() {
    if (route.chapter != null) return renderToranomakiChapter(route.chapter);
    let html = `<div class="topbar"><h1>虎の巻</h1></div>`;
    html += `<div class="card"><input class="tk-search" id="tk-search" placeholder="キーワードで検索（例: カンピロバクター）"></div>`;
    html += `<div class="card" id="tk-list">`;
    TORANOMAKI.forEach((ch, i) => {
      const subj = SUBJECTS[i - 1];
      const icon = subj && IMAGES[subj] ? `<img class="tk-toc-icon" src="${IMAGES[subj]}" alt="">` : "";
      html += `<div class="tk-toc-item" data-chapter="${i}"><span class="tk-toc-left">${icon}${esc(ch.title)}</span><span class="muted">›</span></div>`;
    });
    html += `</div>`;
    app.innerHTML = html;
    app.querySelectorAll("[data-chapter]").forEach(el => {
      el.onclick = () => nav("toranomaki", { chapter: parseInt(el.dataset.chapter, 10) });
    });
    document.getElementById("tk-search").oninput = e => {
      const kw = e.target.value.trim();
      if (!kw) return renderToranomaki();
      renderToranomakiSearch(kw);
    };
  }

  function renderToranomakiSearch(kw) {
    const results = [];
    TORANOMAKI.forEach((ch, ci) => {
      (ch.topics || []).forEach((t, ti) => {
        const hay = t.title + " " + t.body;
        if (hay.indexOf(kw) !== -1) results.push({ ci, ti, chapterTitle: ch.title, topic: t });
      });
    });
    let html = `<div class="topbar"><h1>虎の巻</h1></div>`;
    html += `<div class="card"><input class="tk-search" id="tk-search" value="${esc(kw)}"></div>`;
    if (results.length === 0) {
      html += `<div class="empty-state"><p>「${esc(kw)}」に一致するトピックが見つかりません。</p></div>`;
    } else {
      html += `<div class="card">`;
      results.forEach(r => {
        html += `<div class="tk-toc-item" data-ci="${r.ci}" data-ti="${r.ti}"><span>${esc(r.topic.title)}<br><span class="muted" style="font-weight:400;">${esc(r.chapterTitle)}</span></span><span class="muted">›</span></div>`;
      });
      html += `</div>`;
    }
    app.innerHTML = html;
    document.getElementById("tk-search").oninput = e => {
      const v = e.target.value.trim();
      if (!v) return renderToranomaki();
      renderToranomakiSearch(v);
    };
    app.querySelectorAll("[data-ci]").forEach(el => {
      el.onclick = () => nav("toranomaki", { chapter: parseInt(el.dataset.ci, 10), openTopic: parseInt(el.dataset.ti, 10) });
    });
  }

  function renderToranomakiChapter(ci) {
    const ch = TORANOMAKI[ci];
    let html = `<div class="topbar"><button class="icon-btn" id="tk-back">‹</button><h1>${esc(ch.title)}</h1><span style="width:40px;"></span></div>`;
    if (ch.intro) html += `<div class="card tk-body">${ch.intro}</div>`;
    (ch.topics || []).forEach((t, ti) => {
      html += `<details class="tk-topic" ${route.openTopic === ti ? "open" : ""} data-ti="${ti}"><summary>${esc(t.title)}</summary><div class="tk-body">${t.body}</div></details>`;
    });
    app.innerHTML = html;
    document.getElementById("tk-back").onclick = () => nav("toranomaki");
    app.querySelectorAll(".theme-jump").forEach(el => {
      el.onclick = (e) => {
        e.preventDefault();
        const theme = el.dataset.theme;
        practiceSession = { queue: buildQueue({ mode: "theme", theme }), idx: 0 };
        nav("practice");
      };
    });
  }

  /* ---------------- boot ---------------- */
  document.querySelectorAll("#tabbar [data-icon]").forEach(el => {
    el.innerHTML = ICONS[el.dataset.icon] || "";
  });
  render();
})();
</script>
